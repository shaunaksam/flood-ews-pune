services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: flood_ews_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: flood_ews
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d flood_ews"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: flood_ews_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: flood-ews:local
    container_name: flood_ews_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/flood_ews
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    image: flood-ews:local
    container_name: flood_ews_bot
    command: ["python", "telegram_bot.py"]
    healthcheck:
      disable: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/flood_ews
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  proxy:
    image: caddy:2
    container_name: flood_ews_proxy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: flood_ews_tunnel
    command: tunnel --no-autoupdate --url http://proxy:80
    depends_on:
      - proxy
    profiles: ["tunnel"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
